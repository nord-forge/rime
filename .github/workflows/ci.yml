name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Verify every commit in a PR is DCO signed-off and free of AI attribution.
  # A dedicated DCO GitHub App can replace this once the repo has a GitHub home;
  # until then this job enforces both rules in CI. PR-only (push has no range).
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check DCO sign-off + no AI attribution
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          for sha in $(git rev-list "$BASE_SHA..$HEAD_SHA"); do
            subject=$(git log -1 --format='%s' "$sha")
            body=$(git log -1 --format='%B' "$sha")
            author="$(git log -1 --format='%an <%ae>' "$sha")"

            # 1) require a Signed-off-by trailer matching the author
            if ! printf '%s\n' "$body" | grep -qiE "^Signed-off-by: .+ <.+@.+>"; then
              echo "::error::commit $sha ($subject) is missing a Signed-off-by trailer (run: git commit -s)"
              fail=1
            fi

            # 2) forbid Co-Authored-By / AI attribution trailers
            if printf '%s\n' "$body" | grep -qiE "^Co-authored-by:|^Generated with|Claude Code|noreply@anthropic"; then
              echo "::error::commit $sha ($subject) contains forbidden Co-Authored-By / AI attribution"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "DCO check failed. See errors above."
            exit 1
          fi
          echo "✅ all commits signed off, no forbidden attribution"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Deterministic install: exactly what bun.lock pins.
      - name: Install
        run: bun install --frozen-lockfile

      # Cheapest checks first so failures surface fast.
      - name: Lint (oxlint)
        run: bun run lint

      - name: Format check (oxfmt)
        run: bun run format:check

      - name: Typecheck (tsc)
        run: bun run typecheck

      - name: Unit tests (bun test)
        run: bun run test

      - name: Build all packages
        run: bun run build

      # The one gate a human can't be trusted with: @enveloppe/core gzip budget
      # (PRD §10 = ~100 kB). Override with BUDGET_GZIP if the budget moves.
      - name: Bundle-size gate
        run: bun run size

  # Cross-browser E2E. Separate job so the fast `build` job above never
  # needs browser binaries. WebKit is mandatory — most canvas/pointer quirks live
  # there. Runs the Playwright harness in chromium + webkit.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium webkit

      - name: E2E (chromium + webkit)
        run: bun run e2e

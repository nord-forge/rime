name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Deterministic install: exactly what bun.lock pins.
      - name: Install
        run: bun install --frozen-lockfile

      # Cheapest checks first so failures surface fast.
      - name: Lint (oxlint)
        run: bun run lint

      - name: Format check (oxfmt)
        run: bun run format:check

      - name: Typecheck (tsc)
        run: bun run typecheck

      - name: Unit tests (bun test)
        run: bun run test

      - name: Build all packages
        run: bun run build

      # The one gate a human can't be trusted with: @enveloppe/core gzip budget
      # (PRD §10, OD-4 = ~100 kB). Override with BUDGET_GZIP if the budget moves.
      - name: Bundle-size gate
        run: bun run size

  # Cross-browser E2E (ENV-04). Separate job so the fast `build` job above never
  # needs browser binaries. WebKit is mandatory — most canvas/pointer quirks live
  # there. Runs the Playwright harness in chromium + webkit.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium webkit

      - name: E2E (chromium + webkit)
        run: bun run e2e

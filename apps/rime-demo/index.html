<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rime — Demo</title>
    <style>
      /* Reset only; do NOT set `display` on rime-editor — its :host grid layout
         (palette | canvas | properties) must stand. The element is sized in main.ts. */
      html,
      body {
        margin: 0;
        block-size: 100%;
        font: 14px system-ui, sans-serif;
      }
      #app {
        display: grid;
        grid-template-rows: auto 1fr;
        block-size: 100vh;
      }
      .toolbar {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 8px 12px;
        border-block-end: 1px solid #e4e4e7;
        background: #fff;
      }
      .toolbar .spacer {
        flex: 1;
      }
      .toolbar button,
      .toolbar select {
        block-size: 30px;
        padding: 0 10px;
        border: 1px solid #d4d4d8;
        border-radius: 6px;
        background: #fff;
        font: inherit;
        cursor: pointer;
      }
      .toolbar button:hover {
        background: #f4f4f5;
      }
      .toolbar strong {
        margin-inline-end: 4px;
      }
      #status {
        color: #16a34a;
        font-size: 12px;
      }
      dialog#export {
        inline-size: min(820px, 90vw);
        block-size: 80vh;
        border: 1px solid #d4d4d8;
        border-radius: 10px;
        padding: 0;
      }
      dialog#export .head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border-block-end: 1px solid #e4e4e7;
      }
      dialog#export pre {
        margin: 0;
        padding: 14px;
        overflow: auto;
        block-size: calc(80vh - 52px);
        white-space: pre-wrap;
        word-break: break-word;
        background: #18181b;
        color: #e4e4e7;
        font: 12px/1.5 ui-monospace, monospace;
      }
    </style>
  </head>
  <body>
    <main id="app">
      <div class="toolbar">
        <strong>Rime demo</strong>
        <button id="save" type="button">Save</button>
        <button id="load" type="button">Load</button>
        <button id="reset" type="button">Reset</button>
        <span id="status" aria-live="polite"></span>
        <span class="spacer"></span>
        <label>Theme <select id="theme"></select></label>
        <button id="export-btn" type="button">View MJML</button>
      </div>
      <!-- the <rime-editor> is appended here by main.ts -->
    </main>

    <dialog id="export">
      <div class="head">
        <strong>Exported MJML (→ HTML server-side)</strong>
        <span class="spacer"></span>
        <button id="export-copy" type="button">Copy</button>
        <button id="export-close" type="button">Close</button>
      </div>
      <pre id="export-html"></pre>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>rime — email builder</title>
  </head>
  <body>
    <main id="app">
      <header class="bar">
        <div class="brand"><span>rime</span><span class="tag">/email</span></div>
        <span class="grow"></span>
        <span id="status" class="savestate" data-state="idle" aria-live="polite">
          <span class="dot"></span><span id="status-label">Up to date</span>
        </span>
        <div id="theme" class="seg" role="group" aria-label="Editor theme"></div>
        <button id="reset" class="btn ghost" type="button">Reset</button>
        <button id="export-btn" class="btn primary" type="button">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m8 8-4 4 4 4" /><path d="m16 8 4 4-4 4" />
          </svg>
          Export
        </button>
      </header>
      <div class="stage"><!-- <rime-editor> appended here by main.ts --></div>
    </main>

    <dialog id="export">
      <div class="modalgrid">
        <div class="head">
          <strong>Exported MJML</strong>
          <span class="sub">rendered server-side to HTML</span>
          <span class="grow"></span>
          <button id="export-copy" class="btn ghost" type="button">Copy</button>
          <button id="export-close" class="btn" type="button">Close</button>
        </div>
        <pre id="export-html"></pre>
      </div>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
